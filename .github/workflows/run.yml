name: 2Pink Auto Active

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Số tài khoản (1, 2, 3, 4, 5, 6)'
        required: true
        default: '1'
      action:
        description: 'on hoặc off'
        required: true
        default: 'on'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Determine account and action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACCOUNT=${{ inputs.account }}" >> $GITHUB_ENV
            echo "ACTION=${{ inputs.action }}" >> $GITHUB_ENV
          fi

      - name: Run script
        env:
          USERNAME_2PINK: ${{ env.ACCOUNT == '1' && secrets.USERNAME_2PINK_1 || env.ACCOUNT == '2' && secrets.USERNAME_2PINK_2 || env.ACCOUNT == '3' && secrets.USERNAME_2PINK_3 || env.ACCOUNT == '4' && secrets.USERNAME_2PINK_4 || env.ACCOUNT == '5' && secrets.USERNAME_2PINK_5 || secrets.USERNAME_2PINK_6 }}
          PASSWORD_2PINK: ${{ env.ACCOUNT == '1' && secrets.PASSWORD_2PINK_1 || env.ACCOUNT == '2' && secrets.PASSWORD_2PINK_2 || env.ACCOUNT == '3' && secrets.PASSWORD_2PINK_3 || env.ACCOUNT == '4' && secrets.PASSWORD_2PINK_4 || env.ACCOUNT == '5' && secrets.PASSWORD_2PINK_5 || secrets.PASSWORD_2PINK_6 }}
          ACTION: ${{ env.ACTION }}
          ACCOUNT: ${{ env.ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python auto_login.py
