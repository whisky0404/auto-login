name: 2Pink Auto Active

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run script
        env:
          USERNAME_2PINK: ${{ secrets.USERNAME_2PINK }}
          PASSWORD_2PINK: ${{ secrets.PASSWORD_2PINK }}
        run: python auto_login.py
